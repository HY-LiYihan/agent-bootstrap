name: script-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n install.sh
          bash -n install-codex.sh
          bash -n agent
          find agents -name 'install.sh' -print0 | xargs -0 -I{} bash -n {}
          bash -n switch.sh
          node --check shared/codex-provider-sync.js
          node --check switch.js
      - name: Docs page smoke check
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          HTMLParser().feed(Path('docs/index.html').read_text())
          PY
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]).join('\n');
          fs.writeFileSync('/tmp/agent-bootstrap-docs-page.js', scripts);
          NODE
          node --check /tmp/agent-bootstrap-docs-page.js
          grep -n 'install-codex.sh' docs/index.html
          grep -n 'install-codex.ps1' docs/index.html
          grep -n 'CI-tested install paths' docs/index.html
          grep -n 'claudecode' docs/index.html
          grep -n 'openclaw' docs/index.html
          grep -n 'hermes' docs/index.html
      - name: Codex stable entrypoint dry run
        run: CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --dry-run --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
      - name: Codex Node fallback dry run
        run: |
          tmp="$(mktemp -d)"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin" NVM_DIR="$tmp/nvm" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --dry-run --no-bun --skip-shell-rc --skip-smoke-test --yes | tee "$tmp/out"
          grep -E 'npm is missing|Installing NVM|nvm/archive|npm install -g @openai/codex' "$tmp/out"
          grep -E 'NVM_NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node/' "$tmp/out"
      - name: Codex Bun install falls back to npm
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/codex" "$tmp/project"
          cat > "$tmp/bin/bun" <<'SH'
          #!/usr/bin/env bash
          if [[ "$1" == "--version" ]]; then
            echo "1.2.1"
            exit 0
          fi
          if [[ "$1" == "install" ]]; then
            echo "fake bun install failed"
            exit 1
          fi
          exit 1
          SH
          cat > "$tmp/bin/npm" <<'SH'
          #!/usr/bin/env bash
          echo "fake npm $*"
          exit 0
          SH
          chmod +x "$tmp/bin/bun" "$tmp/bin/npm"
          PATH="$tmp/bin:/usr/bin:/bin:/usr/sbin:/sbin" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --no-sync-provider-history --no-install-backup --skip-shell-rc --skip-smoke-test --yes | tee "$tmp/out"
          grep -nE 'Bun failed to install @openai/codex; falling back to npm' "$tmp/out"
          grep -nE 'fake npm install -g @openai/codex' "$tmp/out"
      - name: Codex reply smoke test with fake CLI on Ubuntu
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/codex" "$tmp/project"
          cat > "$tmp/bin/codex" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then echo "codex-cli fake"; exit 0; fi
          if [[ "${1:-}" == "exec" ]]; then
            out=""
            while [[ $# -gt 0 ]]; do
              case "$1" in --output-last-message) out="$2"; shift 2 ;; *) shift ;; esac
            done
            printf 'hello from fake codex\n' > "$out"
            exit 0
          fi
          exit 1
          SH
          chmod +x "$tmp/bin/codex"
          PATH="$tmp/bin:/usr/bin:/bin:/usr/sbin:/sbin" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --no-install-backup --yes | tee "$tmp/out"
          grep -n 'Codex replied in' "$tmp/out"
          grep -n 'Reply preview: hello from fake codex' "$tmp/out"
      - name: Codex default preserves official config behavior
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home"
          CODEX_INSTALL_BACKUP_DIR="$tmp/backup" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
          test ! -f "$tmp/codex/config.toml"
          grep -nE 'export OPENAI_API_KEY="test-token"' "$tmp/codex/private.env"
          grep -nE 'export OPENAI_BASE_URL="https://example.test/v1"' "$tmp/codex/private.env"
          grep -nE 'export CODEX_API_KEY="test-token"' "$tmp/codex/private.env"
          grep -nE 'export CODEX_API_URL="https://example.test/v1"' "$tmp/codex/private.env"
      - name: Codex provider id is ignored by default
        run: |
          tmp="$(mktemp -d)"
          CODEX_PROVIDER_ID=other CODEX_INSTALL_BACKUP_DIR="$tmp/backup" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --skip-smoke-test --yes | tee "$tmp/out"
          test ! -f "$tmp/codex/config.toml"
          grep -nE 'Existing config|official Codex defaults|Preserve Codex configuration' "$tmp/out"
      - name: Codex existing config is unchanged
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/codex" "$tmp/project"
          cat > "$tmp/codex/config.toml" <<'TOML'
          model = "old"

          [marketplaces.openai-bundled]
          source_type = "local"
          source = "/tmp/bundled-marketplaces/openai-bundled"

          [plugins."browser-use@openai-bundled"]
          enabled = true
          TOML
          CODEX_INSTALL_BACKUP_DIR="$tmp/backup" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
          grep -nE 'model = "old"' "$tmp/codex/config.toml"
          ! grep -nE 'model = "gpt-5.5"' "$tmp/codex/config.toml"
          grep -nE '^\[marketplaces.openai-bundled\]' "$tmp/codex/config.toml"
          grep -nE 'source = "/tmp/bundled-marketplaces/openai-bundled"' "$tmp/codex/config.toml"
          grep -nE '^\[plugins\."browser-use@openai-bundled"\]' "$tmp/codex/config.toml"
      - name: Codex install backup and restore
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/codex" "$tmp/project"
          printf 'model = "before"\n' > "$tmp/codex/config.toml"
          printf 'before agents\n' > "$tmp/project/AGENTS.md"
          CODEX_INSTALL_BACKUP_DIR="$tmp/backup" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
          backup_dir="$(cat "$tmp/codex/.last-install-backup")"
          test -f "$backup_dir/.codex/config.toml"
          grep -nE 'model = "before"' "$tmp/codex/config.toml"
          grep -nE 'before agents' "$tmp/project/AGENTS.md"
          printf 'model = "after"\n' > "$tmp/codex/config.toml"
          CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" ./agents/codex/install.sh --restore "$backup_dir"
          grep -nE 'model = "before"' "$tmp/codex/config.toml"
          grep -nE 'before agents' "$tmp/project/AGENTS.md"
      - name: Codex cleanup backups command
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home/.codex.backup.20260101010101" "$tmp/home/.codex.backup.20260101010102"
          HOME="$tmp/home" ./agents/codex/install.sh --cleanup-backups
          test ! -d "$tmp/home/.codex.backup.20260101010101"
          test ! -d "$tmp/home/.codex.backup.20260101010102"
      - name: Codex dispatcher dry run
        run: AGENT=codex AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/v1 ./install.sh --local . --dry-run --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
      - name: Codex dispatcher no-extra-args dry run
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/agents/codex"
          printf '#!/usr/bin/env bash\nset -euo pipefail\necho "stub codex installer: $*"\n' > "$tmp/agents/codex/install.sh"
          chmod +x "$tmp/agents/codex/install.sh"
          AGENT=codex AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/v1 ./install.sh --local "$tmp"
      - name: Codex safe profile dry run
        run: CODEX_SECURITY_PROFILE=safe AGENT=codex AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/v1 ./install.sh --local . --dry-run --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
      - name: Default agent entrypoint dry run
        run: AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/v1 AGENT_BOOTSTRAP_LOCAL_SOURCE=. AGENT_BOOTSTRAP_INSTALL_ARGS='--dry-run --skip-codex-install --skip-shell-rc --skip-smoke-test --yes' bash -c '. ./agent'
      - name: Claude Code dispatcher dry run
        run: |
          AGENT=claudecode AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/anthropic AGENT_MODEL=claude-sonnet-4-5 ./install.sh --local . --dry-run --skip-claude-install | grep -n 'Would set Claude default model: claude-sonnet-4-5'
      - name: Claude Code model config generation
        run: |
          tmp="$(mktemp -d)"
          HOME="$tmp" CLAUDE_HOME="$tmp/.claude" CLAUDE_TOKEN=test-token CLAUDE_API_URL=https://example.test/anthropic CLAUDE_MODEL=claude-sonnet-4-5 ./agents/claudecode/install.sh --skip-install
          node - "$tmp/.claude/settings.json" <<'NODE'
          const fs = require('node:fs');
          const settings = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (settings.model !== 'claude-sonnet-4-5') throw new Error('Claude settings.model missing');
          if (settings.env.ANTHROPIC_MODEL !== 'claude-sonnet-4-5') throw new Error('Claude ANTHROPIC_MODEL missing');
          if (settings.env.ANTHROPIC_AUTH_TOKEN !== 'test-token') throw new Error('Claude token missing');
          if (settings.env.ANTHROPIC_BASE_URL !== 'https://example.test/anthropic') throw new Error('Claude base URL missing');
          NODE
      - name: OpenClaw dispatcher dry run
        run: AGENT=openclaw AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/anthropic ./install.sh --local . --dry-run
      - name: Hermes dispatcher dry run
        run: AGENT=hermes AGENT_TOKEN=test-token AGENT_BASE_URL=https://example.test/v1 AGENT_MODEL=gpt-5.5 ./install.sh --local . --dry-run --skip-install
      - name: Codex++ dispatcher dry run
        run: AGENT=codexplusplus ./install.sh --local . --dry-run --skip-setup --provider-sync
      - name: Agent switch dry run
        run: |
          export AGENT_BOOTSTRAP_HOME="$(mktemp -d)"
          node switch.js add test --token test-token --base-url https://example.test/api
          node switch.js list
          node switch.js use test --dry-run
          node switch.js shell-hook
      - name: Codex provider history sync test
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/sessions/2026/05/14"
          cat > "$tmp/config.toml" <<'TOML'
          model_provider = "custom"
          TOML
          rollout="$tmp/sessions/2026/05/14/rollout-test.jsonl"
          printf '%s\n%s\n%s\n%s\n' \
            '{"type":"session_meta","payload":{"model_provider":"sss","id":"abc"}}' \
            '{"type":"assistant_message","payload":{"model_provider":"sss","text":"also update me"}}' \
            '{"type":"user_message","payload":{"text":"keep me"}}' \
            'not-json but keep me' > "$rollout"
          json_file="$tmp/sessions/2026/05/14/session-test.json"
          printf '%s\n' '{"payload":{"model_provider":"sss","nested":{"model_provider":"legacy"},"text":"keep json text"}}' > "$json_file"
          sqlite3 "$tmp/state_5.sqlite" 'CREATE TABLE threads (id TEXT PRIMARY KEY, model_provider TEXT); INSERT INTO threads VALUES ("t1", "sss");'
          node shared/codex-provider-sync.js --codex-home "$tmp"
          node shared/codex-provider-sync.js --codex-home "$tmp" --provider custom --verify-only --json > "$tmp/verify.json"
          node - "$rollout" "$json_file" <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split('\n');
          const first = JSON.parse(lines[0]);
          const second = JSON.parse(lines[1]);
          if (first.payload.model_provider !== 'custom') throw new Error('metadata provider was not synced');
          if (second.payload.model_provider !== 'custom') throw new Error('event provider was not synced');
          if (lines[2] !== '{"type":"user_message","payload":{"text":"keep me"}}') throw new Error('provider-less rollout line changed');
          if (lines[3] !== 'not-json but keep me') throw new Error('malformed rollout line changed');
          const json = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (json.payload.model_provider !== 'custom') throw new Error('json provider was not synced');
          if (json.payload.nested.model_provider !== 'custom') throw new Error('nested json provider was not synced');
          if (json.payload.text !== 'keep json text') throw new Error('json text changed');
          NODE
          node - "$tmp/verify.json" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!result.verified) throw new Error('provider sync verification failed');
          if (result.sessionRemainingFields !== 0) throw new Error('session provider fields still mismatched');
          if (result.sqliteRemainingRows !== 0) throw new Error('sqlite provider rows still mismatched');
          NODE
          test "$(sqlite3 "$tmp/state_5.sqlite" 'SELECT model_provider FROM threads WHERE id="t1";')" = custom
          test -d "$tmp/backups_state/provider-sync"

  macos-codex:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Codex stable entrypoint dry run on macOS
        run: |
          tmp="$(mktemp -d)"
          CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --dry-run --skip-codex-install --skip-shell-rc --skip-smoke-test --yes
      - name: Codex reply smoke test with fake CLI on macOS
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/codex" "$tmp/project"
          cat > "$tmp/bin/codex" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then echo "codex-cli fake"; exit 0; fi
          if [[ "${1:-}" == "exec" ]]; then
            out=""
            while [[ $# -gt 0 ]]; do
              case "$1" in --output-last-message) out="$2"; shift 2 ;; *) shift ;; esac
            done
            printf 'hello from fake codex\n' > "$out"
            exit 0
          fi
          exit 1
          SH
          chmod +x "$tmp/bin/codex"
          PATH="$tmp/bin:/usr/bin:/bin:/usr/sbin:/sbin" CODEX_HOME="$tmp/codex" CODEX_PROJECT_DIR="$tmp/project" CODEX_TOKEN=test-token CODEX_API_URL=https://example.test/v1 ./install-codex.sh --local . --skip-codex-install --skip-shell-rc --no-install-backup --yes | tee "$tmp/out"
          grep -n 'Codex replied in' "$tmp/out"
          grep -n 'Reply preview: hello from fake codex' "$tmp/out"

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errorsFound = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | Format-List | Out-String | Write-Host
              $errorsFound = $true
            }
          }
          if ($errorsFound) { exit 1 }
      - name: Codex PowerShell entrypoint dry run
        shell: pwsh
        run: |
          $env:CODEX_TOKEN = 'test-token'
          $env:CODEX_API_URL = 'https://example.test/v1'
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-entry'
          $env:CODEX_PROJECT_DIR = Join-Path $env:RUNNER_TEMP 'project-entry'
          $env:AGENT_BOOTSTRAP_LOCAL_SOURCE = (Get-Location).Path
          .\install-codex.ps1 -DryRun -SkipCodexInstall -SkipProfileUpdate -SkipSmokeTest
      - name: Interactive entrypoint smoke check
        shell: pwsh
        run: |
          if (-not (Test-Path .\agent.ps1)) { exit 1 }
      - name: Codex PowerShell dry run
        shell: pwsh
        run: |
          $env:CODEX_TOKEN = 'test-token'
          $env:CODEX_API_URL = 'https://example.test/v1'
          $env:CODEX_SECURITY_PROFILE = 'safe'
          .\agents\codex\install.ps1 -LocalSource . -DryRun -SkipCodexInstall -SkipProfileUpdate -SkipSmokeTest
      - name: Codex PowerShell reply smoke test with fake CLI
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N')))
          $bin = Join-Path $tmp.FullName 'bin'
          $codex = Join-Path $tmp.FullName 'codex'
          $project = Join-Path $tmp.FullName 'project'
          New-Item -ItemType Directory -Path $bin, $codex, $project -Force | Out-Null
          $fake = Join-Path $bin 'codex.cmd'
          Set-Content -Path $fake -Value @'
          @echo off
          if "%1"=="--version" (
            echo codex-cli fake
            exit /b 0
          )
          if "%1"=="exec" goto exec
          exit /b 1
          :exec
          set OUT=
          :loop
          if "%~1"=="" goto done
          if "%~1"=="--output-last-message" (
            shift
            set "OUT=%~1"
          )
          shift
          goto loop
          :done
          if "%OUT%"=="" exit /b 2
          powershell -NoProfile -Command "Set-Content -Path $env:OUT -Value 'hello from fake codex' -Encoding UTF8"
          exit /b 0
          '@
          $env:Path = "$bin;$env:Path"
          $env:CODEX_TOKEN = 'test-token'
          $env:CODEX_API_URL = 'https://example.test/v1'
          .\agents\codex\install.ps1 -LocalSource . -CodexHome $codex -ProjectDir $project -SkipCodexInstall -SkipProfileUpdate -NoInstallBackup -Yes *>&1 | Tee-Object -FilePath (Join-Path $tmp.FullName 'out.txt')
          Select-String -Path (Join-Path $tmp.FullName 'out.txt') -Pattern 'Codex replied in'
          Select-String -Path (Join-Path $tmp.FullName 'out.txt') -Pattern 'Reply preview: hello from fake codex'
      - name: Codex PowerShell provider id is fixed
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N')))
          $codex = Join-Path $tmp.FullName 'codex'
          $project = Join-Path $tmp.FullName 'project'
          $env:CODEX_TOKEN = 'test-token'
          $env:CODEX_API_URL = 'https://example.test/v1'
          $env:CODEX_PROVIDER_ID = 'other'
          .\agents\codex\install.ps1 -LocalSource . -CodexHome $codex -ProjectDir $project -SkipCodexInstall -SkipProfileUpdate -SkipSmokeTest -Yes *>&1 | Tee-Object -FilePath (Join-Path $tmp.FullName 'out.txt')
          Select-String -Path (Join-Path $tmp.FullName 'out.txt') -Pattern 'Ignoring CODEX_PROVIDER_ID'
          Select-String -Path (Join-Path $codex 'config.toml') -Pattern 'model_provider = "custom"'
          Select-String -Path (Join-Path $codex 'config.toml') -Pattern '\[model_providers\."custom"\]'
          Remove-Item Env:\CODEX_PROVIDER_ID
      - name: Codex PowerShell backup and restore
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N')))
          $codex = Join-Path $tmp.FullName 'codex'
          $project = Join-Path $tmp.FullName 'project'
          New-Item -ItemType Directory -Path $codex, $project -Force | Out-Null
          Set-Content -Path (Join-Path $codex 'config.toml') -Value 'model = "before"'
          Set-Content -Path (Join-Path $project 'AGENTS.md') -Value 'before agents'
          $env:CODEX_TOKEN = 'test-token'
          $env:CODEX_API_URL = 'https://example.test/v1'
          .\agents\codex\install.ps1 -LocalSource . -CodexHome $codex -ProjectDir $project -SkipCodexInstall -SkipProfileUpdate -SkipSmokeTest -Yes
          $backup = (Get-Content (Join-Path $codex '.last-install-backup') -Raw).Trim()
          if (-not (Test-Path (Join-Path $backup 'codex\config.toml'))) { throw 'missing backup config' }
          Select-String -Path (Join-Path $codex 'config.toml') -Pattern 'model = "gpt-5.5"'
          .\agents\codex\install.ps1 -CodexHome $codex -ProjectDir $project -Restore $backup
          Select-String -Path (Join-Path $codex 'config.toml') -Pattern 'model = "before"'
          Select-String -Path (Join-Path $project 'AGENTS.md') -Pattern 'before agents'
      - name: Claude Code PowerShell dry run
        shell: pwsh
        run: |
          $env:CLAUDE_CLIENT_TOKEN = 'test-token'
          $env:CLAUDE_API_URL = 'https://example.test/anthropic'
          $env:CLAUDE_MODEL = 'claude-sonnet-4-5'
          .\agents\claudecode\install.ps1 -DryRun -SkipInstall *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'claude-model.txt')
          Select-String -Path (Join-Path $env:RUNNER_TEMP 'claude-model.txt') -Pattern 'Would set Claude default model: claude-sonnet-4-5'
      - name: OpenClaw PowerShell dry run
        shell: pwsh
        run: |
          $env:OPENCLAW_TOKEN = 'test-token'
          $env:OPENCLAW_BASE_URL = 'https://example.test/anthropic'
          .\agents\openclaw\install.ps1 -DryRun
      - name: Hermes PowerShell dry run
        shell: pwsh
        run: |
          $env:HERMES_API_KEY = 'test-token'
          $env:HERMES_BASE_URL = 'https://example.test/v1'
          $env:HERMES_MODEL = 'gpt-5.5'
          .\agents\hermes\install.ps1 -DryRun -SkipInstall
      - name: Codex++ PowerShell dry run
        shell: pwsh
        run: .\agents\codexplusplus\install.ps1 -DryRun -SkipSetup -ProviderSync 1
      - name: Agent switch PowerShell wrapper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\switch.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
